[project]
name = "trade-ledger"
version = "0.1.0"
description = "Local trade and investment logger: journal, portfolio and German tax record keeping."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic-settings",
    "httpx",
    "ccxt",
    "python-dateutil",
    "matplotlib",
    "fpdf2",
    "pyyaml",
    "python-multipart>=0.0.32",
]

[project.scripts]
trade-ledger = "trade_ledger.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trade_ledger"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)` default-argument pattern is the
# documented way to declare dependencies — not the mutable-default footgun
# B008 warns about.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ponytail: these two fire on every TestClient import from inside
# starlette/anyio itself (not our code) and aren't actionable — silence by
# exact message so a real warning from our code still surfaces.
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]
